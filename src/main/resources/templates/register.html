<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Smart Grocery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body class="auth-bg">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="auth-card card border-0 shadow-lg p-4 p-md-5">
    <div class="text-center mb-4"><div class="brand-icon">🥬</div><h1 class="h3 fw-bold mt-3">Create your account</h1><p class="text-secondary">Keep your kitchen organized</p></div>
    <div th:replace="~{fragments :: messages}"></div>
    <form method="post" action="/register">
      <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="80" placeholder="Your name">
      <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required placeholder="you@example.com">
      <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="6" required placeholder="At least 6 characters">
      <button class="btn btn-primary w-100 py-2" type="submit">Create account</button>
    </form>
    <p class="text-center mt-4 mb-0">Already registered? <a href="/login">Sign in</a></p>
  </div>
</div>
</body></html>
