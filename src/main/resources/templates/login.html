<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Smart Grocery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body class="auth-bg">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="auth-card card border-0 shadow-lg p-4 p-md-5">
    <div class="text-center mb-4"><div class="brand-icon">🛒</div><h1 class="h3 fw-bold mt-3">Welcome back</h1><p class="text-secondary">Sign in to manage your groceries</p></div>
    <div th:replace="~{fragments :: messages}"></div>
    <form method="post" action="/login">
      <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required autocomplete="email" placeholder="you@example.com">
      <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required autocomplete="current-password" placeholder="At least 6 characters">
      <button class="btn btn-primary w-100 py-2" type="submit">Sign in</button>
    </form>
    <p class="text-center mt-4 mb-0">New here? <a href="/register">Create an account</a></p>
  </div>
</div>
</body></html>
