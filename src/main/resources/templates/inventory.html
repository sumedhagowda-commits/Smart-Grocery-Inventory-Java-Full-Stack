<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory | Smart Grocery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container py-4 py-lg-5">
  <div th:replace="~{fragments :: messages}"></div>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="eyebrow mb-1">STOCK CONTROL</p><h1 class="h2 fw-bold mb-1">Grocery inventory</h1><p class="text-secondary mb-0">Add, edit, search, and update your stock.</p></div><a class="btn btn-primary" href="/items/new">＋ Add item</a></div>
  <form class="panel mb-4" method="get" action="/inventory">
    <div class="row g-2 align-items-end"><div class="col-md-6"><label class="form-label">Search item</label><input class="form-control" name="search" th:value="${search}" placeholder="Search by item name..."></div>
      <div class="col-md-4"><label class="form-label">Category</label><select class="form-select" name="category"><option value="">All categories</option><option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat == selectedCategory}"></option></select></div>
      <div class="col-md-2 d-grid"><button class="btn btn-outline-primary" type="submit">Filter</button></div></div>
  </form>
  <section class="panel">
    <div th:if="${#lists.isEmpty(items)}" class="empty-state py-5"><div class="fs-1 mb-2">🥦</div><h2 class="h5">No grocery items found</h2><p class="mb-3">Add your first item or change your search.</p><a class="btn btn-primary" href="/items/new">Add grocery item</a></div>
    <div th:unless="${#lists.isEmpty(items)}" class="table-responsive"><table class="table align-middle table-hover mb-0">
      <thead><tr><th>Item</th><th>Category</th><th>Quantity</th><th>Minimum</th><th>Expiry</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
      <tbody><tr th:each="item : ${items}">
        <td class="fw-semibold" th:text="${item.itemName}">Rice</td><td><span class="category-pill" th:text="${item.category}">Grains</span></td>
        <td th:text="${item.quantity + ' ' + item.unit}">5 kg</td><td th:text="${item.minStock + ' ' + item.unit}">2 kg</td>
        <td th:text="${item.expiryDate == null ? '—' : item.expiryDate}">—</td>
        <td><span th:if="${item.quantity <= item.minStock}" class="badge text-bg-warning">Low stock</span><span th:unless="${item.quantity <= item.minStock}" class="badge text-bg-success">In stock</span></td>
        <td><div class="d-flex justify-content-end flex-wrap gap-1">
          <form th:action="@{/items/{id}/quantity(id=${item.id})}" method="post" class="d-flex gap-1"><button class="btn btn-sm btn-outline-secondary" name="action" value="decrease" title="Decrease quantity">−</button><button class="btn btn-sm btn-outline-secondary" name="action" value="increase" title="Increase quantity">+</button></form>
          <a class="btn btn-sm btn-outline-primary" th:href="@{/items/{id}/edit(id=${item.id})}">Edit</a>
          <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post" onsubmit="return confirm('Delete this item?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form>
        </div></td>
      </tr></tbody>
    </table></div>
  </section>
</main>
</body></html>
