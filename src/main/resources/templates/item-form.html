<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle} + ' | Smart Grocery'">Grocery item</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="/styles.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container py-4 py-lg-5">
  <div class="form-shell">
    <a href="/inventory" class="small text-decoration-none">← Back to inventory</a>
    <h1 class="h3 fw-bold mt-3 mb-1" th:text="${pageTitle}">Add Grocery Item</h1><p class="text-secondary mb-4">Keep quantities and expiry dates accurate.</p>
    <div th:replace="~{fragments :: messages}"></div>
    <form method="post" action="/items/save">
      <input type="hidden" name="id" th:value="${item.id}">
      <div class="mb-3"><label class="form-label">Item name *</label><input class="form-control" name="itemName" th:value="${item.itemName}" required maxlength="100" placeholder="e.g. Basmati rice"></div>
      <div class="row g-3"><div class="col-md-6"><label class="form-label">Category *</label><input class="form-control" name="category" th:value="${item.category}" required placeholder="e.g. Grains"></div>
        <div class="col-md-6"><label class="form-label">Unit *</label><select class="form-select" name="unit" required><option value="">Choose unit</option><option th:each="u : ${ {'kg','g','litre','ml','packet','piece','dozen','bottle'} }" th:value="${u}" th:text="${u}" th:selected="${u == item.unit}"></option></select></div>
        <div class="col-md-6"><label class="form-label">Current quantity *</label><input class="form-control" type="number" name="quantity" min="0" step="0.01" th:value="${item.id == null ? 0 : item.quantity}" required></div>
        <div class="col-md-6"><label class="form-label">Minimum stock level *</label><input class="form-control" type="number" name="minStock" min="0" step="0.01" th:value="${item.id == null ? 1 : item.minStock}" required></div>
        <div class="col-12"><label class="form-label">Expiry date (optional)</label><input class="form-control" type="date" name="expiryDate" th:value="${item.expiryDate}"><div class="form-text">The dashboard flags items expiring within the next 7 days.</div></div></div>
      <div class="d-flex gap-2 mt-4"><button class="btn btn-primary px-4" type="submit">Save item</button><a class="btn btn-light" href="/inventory">Cancel</a></div>
    </form>
  </div>
</main>
</body></html>
